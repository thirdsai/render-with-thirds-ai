<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    box-sizing: border-box; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between;
    background: {{ background | default('#111827') }}; color: {{ text | default('#ffffff') }};
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .top { display: flex; align-items: center; gap: 20px; font-size: 28px; letter-spacing: 0.02em; opacity: 0.85; }
  .bar { width: 56px; height: 8px; border-radius: 4px; background: {{ accent | default('#f59e0b') }}; }
  .cat { color: {{ accent | default('#f59e0b') }}; text-transform: uppercase; font-weight: 700; font-size: 24px; }
  h1 { margin: 0; font-size: 68px; line-height: 1.08; font-weight: 800; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .excerpt { margin-top: 24px; font-size: 30px; line-height: 1.35; opacity: 0.8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { display: flex; justify-content: space-between; font-size: 26px; opacity: 0.75; }
</style>
</head>
<body>
  <div class="top"><span class="bar"></span><span>{{ site_name | default('') }}</span>{% if category %}<span class="cat">{{ category }}</span>{% endif %}</div>
  <div>
    <h1>{{ title | default('') }}</h1>
    {% if excerpt %}<div class="excerpt">{{ excerpt }}</div>{% endif %}
  </div>
  <div class="foot"><span>{{ author | default('') }}</span><span>{{ site_host | default('') }}</span></div>
</body>
</html>
